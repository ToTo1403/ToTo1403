name: WakaTime Stats


on:

  schedule:

    - cron: "0 */12 * * *"


  workflow_dispatch:


jobs:

  waka:


    runs-on: ubuntu-latest


    steps:


      - uses: anmol098/waka-readme-stats@master

        with:


          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}


          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


          SHOW_TITLE: true


          SHOW_TIMEZONE: true


          SHOW_LANGUAGE: true


          SHOW_OS: true


          SHOW_PROJECTS: true


          SHOW_EDITORS: true
